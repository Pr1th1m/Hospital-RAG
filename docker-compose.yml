version: "3.9"

services:
  db:
    image: postgres:15
    container_name: hospital_rag_db
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: 1234
      POSTGRES_DB: Hospital_RAG
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: hospital_rag_backend
    restart: always
    ports:
      - "8000:8000"
    env_file:
      - ./backend/.env
    environment:
      # Override DB_URL so it points to the 'db' service, not localhost
      DB_URL: postgresql://postgres:1234@db:5432/Hospital_RAG
    depends_on:
      - db

volumes:
  postgres_data:
